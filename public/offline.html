<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Signal Home — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #210019; color: #fff6df; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 28rem; }
      button { min-height: 48px; padding: 0 24px; border-radius: 18px; border: 1px solid rgba(255,217,141,.45); background: rgba(255,255,255,.1); color: inherit; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Signal Home can't reach the internet right now. Anything you send is saved on this device and will be delivered when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
